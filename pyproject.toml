[build-system]
requires = ["hatchling==1.31.0"]
build-backend = "hatchling.build"

[project]
name = "workbench-mcp"
version = "0.1.0"
description = "Secure FastMCP server for controlled repository inspection, file operations, test execution, and workspace diagnostics."
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = "MIT"
authors = [
  { name = "Bhawna Pannu" },
]
keywords = ["mcp", "fastmcp", "workspace", "security", "developer-tools"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development",
]
dependencies = [
  "fastmcp==3.4.4",
  "pydantic==2.13.4",
]

[dependency-groups]
dev = [
  "build==1.5.0",
  "mypy==2.3.0",
  "pytest==9.1.1",
  "pytest-asyncio==1.4.0",
  "pytest-cov==7.1.0",
  "ruff==0.15.22",
]

[project.urls]
Repository = "https://github.com/bhawnapannu2701/workbench-mcp"
Issues = "https://github.com/bhawnapannu2701/workbench-mcp/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/workbench_mcp"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["A", "ANN", "ARG", "B", "C4", "E", "F", "I", "N", "PL", "PTH", "RUF", "S", "SIM", "UP", "W"]
ignore = [
  "ANN401",
  "PLR0913",
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["PLR2004", "S101"]

[tool.ruff.format]
line-ending = "lf"

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
show_error_codes = true
mypy_path = ["src"]

[tool.pytest.ini_options]
minversion = "9.0"
testpaths = ["tests"]
pythonpath = ["."]
addopts = [
  "--strict-config",
  "--strict-markers",
]
asyncio_mode = "auto"

[tool.coverage.run]
branch = true
source = ["workbench_mcp"]

[tool.coverage.report]
show_missing = true
skip_covered = true
